name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js 22 via nvm
        run: |
          export NVM_DIR="$HOME/.nvm"
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
          . "$NVM_DIR/nvm.sh"
          nvm install 22
          nvm use 22
          node --version
          npm --version
          echo "$NVM_DIR/versions/node/$(nvm version)/bin" >> $GITHUB_PATH

      - name: Verify Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Find APK file
        run: find android/app/build/outputs -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyracube-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Pyracube Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Pyracube Android APK - Debug Build
            
            Download the APK file below and install on your Android device.
            You may need to enable "Install from unknown sources" in your device settings.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
